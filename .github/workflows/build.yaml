name: Build and Deploy Clair

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Every pull request builds the image so a broken Dockerfile fails before
  # merge. Nothing is pushed.
  build:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: bash
        run: |
          docker build --build-arg VERSION="sha-${GITHUB_SHA::7}" -t clair:pr .

  release:
    name: Build and Deploy Clair
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        shell: bash
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          SHA_TAG="sha-${GITHUB_SHA::7}"

          docker build --build-arg VERSION="$SHA_TAG" \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA_TAG" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"

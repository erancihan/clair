name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Go tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clair
          POSTGRES_PASSWORD: clair
          POSTGRES_DB: clair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://clair:clair@localhost:5432/clair?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Generate templ views
        run: go generate ./...

      - name: Vet
        run: go vet ./...

      - name: Build (CGO-free)
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: make test
